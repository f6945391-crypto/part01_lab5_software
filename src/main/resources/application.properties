spring.application.name=champions

# ===== Base de datos (PostgreSQL) =====
# La URL se arma con variables de entorno (ver .env.example / docker-compose.yml).
# Valores por defecto para ejecutar en LOCAL sin Docker.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:champions_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:Pollo2026}

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Fuente de partidos =====
# real     -> API publica football-data.org (requiere MATCH_API_TOKEN)
# simulado -> datos ficticios en codigo (sin red), util para probar sin token
match.api.mode=${MATCH_API_MODE:real}
match.api.base-url=${MATCH_API_BASE_URL:https://api.football-data.org/v4}
match.api.token=${MATCH_API_TOKEN:}
match.api.competition=${MATCH_API_COMPETITION:CL}

# ===== Puerto de la aplicacion =====
server.port=${APP_PORT:8080}

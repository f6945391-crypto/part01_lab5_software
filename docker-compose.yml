services:

  db:
    image: postgres:16-alpine
    container_name: champions-db
    environment:
      POSTGRES_DB: ${DB_NAME:-champions_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      # 5434 en el host para no chocar con un PostgreSQL local (5432) ni otros labs.
      - "5434:5432"
    volumes:
      - champions_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-champions_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: champions-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-champions_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      MATCH_API_MODE: ${MATCH_API_MODE:-real}
      MATCH_API_TOKEN: ${MATCH_API_TOKEN:-}
      MATCH_API_BASE_URL: ${MATCH_API_BASE_URL:-https://api.football-data.org/v4}
      MATCH_API_COMPETITION: ${MATCH_API_COMPETITION:-CL}
      APP_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  champions_pgdata:
